name: dev-benches

services:
  rust-bench:
    env_file: .env
    image: rust-bench:${USER:-brett}
    container_name: rust-bench
    command: sleep infinity
    working_dir: /workspace
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      core: -1
    environment:
      - HISTFILE=/home/${USER:-brett}/.workbenches-history/.zsh_history
      - RUSTUP_HOME=/opt/rust/rustup
      - CARGO_HOME=/home/${USER:-brett}/.cargo
      - RUST_BACKTRACE=1
      - CARGO_REGISTRIES_CRATES_IO_PROTOCOL=sparse
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - rustbench-cargo-cache:/home/${USER:-brett}/.cargo
    networks:
      - rust-bench

volumes:
  rustbench-cargo-cache:
    name: rustbench-cargo-cache

networks:
  rust-bench:
    # Keep rustBench in the dev-benches Compose group without trying to
    # reconcile another bench's logical "default" network.
    name: rust-bench_default
    driver_opts:
      com.docker.network.driver.mtu: "1400"
